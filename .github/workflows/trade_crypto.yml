name: ai4trade-bot-crypto

# The 24/7 crypto twin of trade.yml. Crypto never closes, so this runs every day,
# all hours. The engine (live_trader.py) is reused unchanged — the crypto book is
# selected entirely through env vars (BROKER, MARKET_24_7, REGIME_SYMBOLS, and the
# *_FILE / REPORTS_SUBDIR overrides), so it never touches the stock book's state.
on:
  schedule:
    # SCALPING cadence: every 5 min (GitHub's minimum), 24/7, to match the 5m
    # analysis timeframe. This burns Actions minutes fast (~288 runs/day) — if
    # that matters, loosen to */10 or */15. GitHub crons can be delayed under
    # load, which is fine — the bot is idempotent and self-gates on state.
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".trigger-crypto"    # reliable kick: touch this file to fire a run
  workflow_dispatch:
    inputs:
      flatten:
        description: "Close every open crypto position and open nothing this run"
        type: boolean
        default: false

concurrency:
  group: ai4trade-bot-crypto   # separate group so it never blocks the stock book
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade-crypto:
    runs-on: ubuntu-latest
    env:
      # Job-level so the trade step's `if:` can see it — a step cannot test its
      # own `env:` block, that is evaluated before the step env exists.
      AI4TRADE_TOKEN: ${{ secrets.AI4TRADE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pytz

      - name: Fetch 5m crypto technicals (RSI / Bollinger / vol / S-R)
        continue-on-error: true
        run: python quotes_crypto.py

      - name: Generate scalp setups (5m, long-only) — regenerated every run
        continue-on-error: true
        run: python generate_signals_crypto.py

      - name: AI-Trader (ai4trade.ai) trade — SIMULATED platform book
        if: ${{ env.AI4TRADE_TOKEN != '' }}
        continue-on-error: true
        env:
          BROKER: ai4trade
          AI4TRADE_MARKET: "crypto"
          # One-shot housekeeping: set from the "Run workflow" button to close
          # everything (e.g. after a config change). Empty on scheduled runs.
          FLATTEN_ALL: ${{ inputs.flatten }}
          MARKET_24_7: "yes"            # crypto trades 24/7 — no weekday / market-hours gate
          REGIME_SYMBOLS: "BTC"         # BTC is the market: if BTC flushes, nothing else is safe
          SIGNALS_FILE: "signals_crypto.json"
          QUOTES_FILE: "quotes_crypto.json"
          # Separate ledger from the Alpaca book: the two brokers hold different
          # positions, and one engine reconciling against the wrong one would
          # close positions it does not own.
          STATE_FILE: "live_trader_ai4trade_state.json"
          REPORTS_SUBDIR: "live_trader_ai4trade"
          # The platform grants $100,000 simulated cash on registration.
          BOOK_EQUITY: "100000"
          RISK_PCT: "0.08"
          BASE_SLICES: "1"              # concentrate: a lone signal takes the whole book
          LEVERAGE_CAP: "1.0"
          ALLOW_FRACTIONAL: "yes"
          MAX_POSITIONS: "2"            # 1 coin at $100k, or 2 at $50k each
          ENABLE_SHORT: "no"            # platform supports short/cover; keep this book long-only
          # --- Net-dollar target ------------------------------------------
          # The platform charges no trading fee, so FEE_RATE is 0 and the target
          # is pure price movement. Scaled to the $100k book, $250-$500 is the
          # same 0.5%-1.0% shape the $200 Alpaca book ran at $0.50-$1.00.
          NET_PROFIT_MODE: "yes"
          FEE_RATE: "0.0"
          NET_TARGET_MIN_USD: "250"     # quiet coin: 0.5% of a $50k position
          NET_TARGET_MAX_USD: "500"     # volatile coin: 1.0%
          VOL_SPAN_LO: "0.015"          # BB width <=1.5% of price => use the floor
          VOL_SPAN_HI: "0.050"          # BB width >=5% of price   => use the ceiling
          MIN_RR_NET: "1.0"             # stop distance <= target distance (at least 1:1)
          MAX_TARGET_MOVE_PCT: "0.035"  # don't open trades whose target needs >3.5%
        run: python live_trader.py

      - name: Commit crypto state + reports
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "crypto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
