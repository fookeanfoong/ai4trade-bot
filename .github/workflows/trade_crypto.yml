name: ai4trade-bot-crypto

# The 24/7 crypto twin of trade.yml. Crypto never closes, so this runs every day,
# all hours. The engine (live_trader.py) is reused unchanged — the crypto book is
# selected entirely through env vars (BROKER, MARKET_24_7, REGIME_SYMBOLS, and the
# *_FILE / REPORTS_SUBDIR overrides), so it never touches the stock book's state.
on:
  schedule:
    # SCALPING cadence: every 5 min (GitHub's minimum), 24/7, to match the 5m
    # analysis timeframe. This burns Actions minutes fast (~288 runs/day) — if
    # that matters, loosen to */10 or */15. GitHub crons can be delayed under
    # load, which is fine — the bot is idempotent and self-gates on state.
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".trigger-crypto"    # reliable kick: touch this file to fire a run
  workflow_dispatch:

concurrency:
  group: ai4trade-bot-crypto   # separate group so it never blocks the stock book
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade-crypto:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pytz

      - name: Install Alpaca SDK (only if key is set)
        if: ${{ env.ALPACA_API_KEY_ID != '' }}
        run: pip install --quiet -r requirements-alpaca.txt

      - name: Fetch 5m crypto technicals (RSI / Bollinger / vol / S-R)
        continue-on-error: true
        run: python quotes_crypto.py

      - name: Generate scalp setups (5m, long-only) — regenerated every run
        continue-on-error: true
        run: python generate_signals_crypto.py

      - name: Alpaca crypto paper trade (real execution, cloud, only if key is set)
        if: ${{ env.ALPACA_API_KEY_ID != '' }}
        continue-on-error: true
        env:
          BROKER: alpaca_crypto
          ALPACA_PAPER: "true"          # fake money until you flip to false + confirm
          MARKET_24_7: "yes"            # crypto trades 24/7 — no weekday / market-hours gate
          REGIME_SYMBOLS: "BTC"         # BTC is the market: if BTC flushes, nothing else is safe
          SIGNALS_FILE: "signals_crypto.json"
          QUOTES_FILE: "quotes_crypto.json"
          STATE_FILE: "live_trader_crypto_state.json"
          REPORTS_SUBDIR: "live_trader_crypto"
          BOOK_EQUITY: "200"
          RISK_PCT: "0.08"              # aggressive: bigger risk per scalp (vs 0.05 stock)
          BASE_SLICES: "3"              # 1-3 names each get 1/3 of the book; 4 names split evenly
          LEVERAGE_CAP: "1.0"           # Alpaca crypto is cash-only (non-marginable) — 1x max
          ALLOW_FRACTIONAL: "yes"       # crypto is fractional (buy 0.006 ETH)
          MAX_POSITIONS: "4"            # diversified: up to 4 different coins at once (~$50 each)
          ENABLE_SHORT: "no"            # Alpaca crypto has no shorting — long only
          # --- Net-dollar profit targets ---------------------------------
          # Exit on DOLLARS EARNED AFTER FEES, not on a percentage. At ~$50 a
          # name this puts T1 near +1.5% and T2 near +2.5%; anything needing
          # more than MAX_TARGET_MOVE_PCT is skipped as unreachable.
          NET_PROFIT_MODE: "yes"
          FEE_RATE: "0.0025"            # Alpaca crypto taker ≈ 0.25% per side
          NET_T1_USD: "0.50"            # half out once the position clears $0.50 net
          NET_T2_USD: "1.00"            # rest out at $1.00 net
          MAX_TARGET_MOVE_PCT: "0.035"  # don't open trades whose target needs >3.5%
        run: python live_trader.py

      - name: Commit crypto state + reports
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "crypto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
