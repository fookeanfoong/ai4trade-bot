name: ai4trade-bot-crypto

# The 24/7 crypto twin of trade.yml. Crypto never closes, so this runs every day,
# all hours. The engine (live_trader.py) is reused unchanged — the crypto book is
# selected entirely through env vars (BROKER, MARKET_24_7, REGIME_SYMBOLS, and the
# *_FILE / REPORTS_SUBDIR overrides), so it never touches the stock book's state.
# PAUSED. A 472-trade backtest over two months put this strategy at
# -$0.44/trade expectancy, with GROSS P&L negative (-$17.64) before fees were
# even counted. Live trading it only accumulates losses that the backtester can
# now reproduce for free, so the schedule is off until a variant shows positive
# expectancy. Uncomment to resume; workflow_dispatch still works for flattening.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  # push:
  #   branches: ["main"]
  #   paths:
  #     - ".trigger-crypto"
  workflow_dispatch:
    inputs:
      flatten:
        description: "Close every open crypto position and open nothing this run"
        type: boolean
        default: false

concurrency:
  group: ai4trade-bot-crypto   # separate group so it never blocks the stock book
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade-crypto:
    runs-on: ubuntu-latest
    env:
      # Job-level so the trade step's `if:` can see it — a step cannot test its
      # own `env:` block, that is evaluated before the step env exists.
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pytz

      - name: Install Alpaca SDK (only if key is set)
        if: ${{ env.ALPACA_API_KEY_ID != '' }}
        run: pip install --quiet -r requirements-alpaca.txt

      - name: Fetch 5m crypto technicals (RSI / Bollinger / vol / S-R)
        continue-on-error: true
        run: python quotes_crypto.py

      - name: Crash-news sentinel (free Google News RSS, no key)
        continue-on-error: true
        run: python news_crypto.py

      - name: Generate scalp setups (5m, long-only) — regenerated every run
        continue-on-error: true
        run: python generate_signals_crypto.py

      - name: Alpaca crypto paper trade (real execution path, cloud)
        if: ${{ env.ALPACA_API_KEY_ID != '' }}
        continue-on-error: true
        env:
          BROKER: alpaca_crypto
          ALPACA_PAPER: "true"          # fake money until you flip to false + confirm
          # One-shot housekeeping: set from the "Run workflow" button to close
          # everything (e.g. after a config change). Empty on scheduled runs.
          FLATTEN_ALL: ${{ inputs.flatten }}
          MARKET_24_7: "yes"            # crypto trades 24/7 — no weekday / market-hours gate
          REGIME_SYMBOLS: "BTC"         # BTC is the market: if BTC flushes, nothing else is safe
          SIGNALS_FILE: "signals_crypto.json"
          QUOTES_FILE: "quotes_crypto.json"
          STATE_FILE: "live_trader_crypto_state.json"
          REPORTS_SUBDIR: "live_trader_crypto"
          BOOK_EQUITY: "200"
          RISK_PCT: "0.08"
          BASE_SLICES: "1"              # concentrate: a lone signal takes the whole book
          LEVERAGE_CAP: "1.0"           # Alpaca crypto is cash-only (non-marginable) — 1x max
          ALLOW_FRACTIONAL: "yes"       # crypto is fractional (buy 0.006 ETH)
          MAX_POSITIONS: "2"            # 1 coin at $200, or 2 at $100 each
          ENABLE_SHORT: "no"            # Alpaca crypto has no shorting — long only
          # --- Net-dollar floor, uncapped upside ---------------------------
          # Alpaca crypto takes ~0.25% per side, 2.5x the platform's 0.1%, so
          # the same $0.50 floor needs a bigger move: 0.75% on a $200 position,
          # 1.00% on $100. With RUN_WINNERS that is a FLOOR, not an exit — a
          # trailing stop arms there and the trade can only close higher.
          # Entries rest as limit orders to pay the 0.15% maker fee instead of
          # the 0.25% taker fee; exits stay market so a stop always fills.
          # Round trip 0.50% -> 0.40%. Live attribution showed gross +$2.60
          # against $7.74 of fees, so cost is the thing worth attacking.
          LIMIT_ENTRIES: "yes"
          LIMIT_OFFSET_PCT: "0.0"       # rest at last price: best fill odds
          NET_PROFIT_MODE: "yes"
          # Blended: maker in (0.15%) + taker out (0.25%) = 0.40% round trip,
          # so 0.20% per side is what the target maths should assume.
          FEE_RATE: "0.0020"
          NET_TARGET_MIN_USD: "0.50"
          NET_TARGET_MAX_USD: "1.00"
          RUN_WINNERS: "yes"            # let profit run past the floor
          TRAIL_GIVEBACK_PCT: "0.006"   # give a winner 0.6% of room before taking it
          VOL_SPAN_LO: "0.015"
          VOL_SPAN_HI: "0.050"
          MIN_RR_NET: "1.0"             # stop distance <= floor distance (at least 1:1)
          # A fresh position gets 20 minutes before signal churn can close it.
          # Stops and targets still apply — this only blocks the "bought it, the
          # signal flickered, sold it" round trip that costs 0.5% every time.
          MIN_HOLD_MIN: "20"
          MAX_TARGET_MOVE_PCT: "0.035"
        run: python live_trader.py

      - name: Commit crypto state + reports
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "crypto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
