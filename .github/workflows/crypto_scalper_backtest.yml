name: crypto-scalper-backtest

# CryptoEmaMacdScalper 回测,跑在 Actions 上(这里能拿到币安公开的真实 M5 行情;
# Claude 的沙箱拿不到,所以真实数字只能在这里产生)。
on:
  schedule:
    - cron: "40 6 * * 1"        # 每周一重跑
  workflow_dispatch:
  push:
    paths:
      - backtest_crypto_scalper.py
      - .github/workflows/crypto_scalper_backtest.yml

concurrency:
  group: crypto-scalper-backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest BTC/ETH/SOL M5 (last 6 full months)
        run: python backtest_crypto_scalper.py --symbols BTCUSDT,ETHUSDT,SOLUSDT --months 6
      - name: Commit backtest report
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/crypto_scalper_backtest.md || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "crypto scalper backtest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
