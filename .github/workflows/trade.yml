name: ai4trade-bot

# Cron in UTC. Bots self-gate on NY wall-clock, so extra runs outside RTH are no-ops.
# GitHub's scheduled crons are unreliable (delayed/skipped under load), so we run
# DENSE (every 5 min, the GitHub minimum) to raise the odds one fires near the open,
# AND a claude-code-remote "market-open kick" routine dispatches this workflow at the
# open as a reliable backstop if GitHub drops the whole window.
on:
  schedule:
    - cron: "32,37,47,57 12 * * 1-5"   # premarket (multiple, ~08:3x ET)
    - cron: "*/5 13-21 * * 1-5"        # every 5 min across the session (covers EDT+EST)
    - cron: "7 20 * * 6"               # Sat weekly review
  push:
    branches: ["main"]                  # only main, so branch pushes don't fire redundant runs
    paths:
      - ".trigger"                      # reliable kick: a routine touches this file to fire a run
                                        # (push events are prompt; bot state-commits never touch it, so no loop)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | premarket | weekly"
        required: false
        default: "auto"

concurrency:
  group: ai4trade-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      # Exposed to steps (and their `if:`) so the Alpaca step stays dormant until
      # you add the secret, then activates automatically. Paper by default.
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pytz

      - name: Install Alpaca SDK (only if key is set)
        if: ${{ env.ALPACA_API_KEY_ID != '' }}
        run: pip install --quiet -r requirements-alpaca.txt

      - name: Fetch live quotes
        continue-on-error: true
        run: python quotes.py

      - name: Fetch market-mover news
        continue-on-error: true
        run: python news.py

      # 自动生成当日信号 -> signals.json,再转成 PWA 数据源。
      # 多空都做:LONG_ONLY 留空 => 允许生成空单(bearish)候选。
      - name: Generate today's signals (algorithmic)
        continue-on-error: true
        env:
          LONG_ONLY: ""     # 空 = 多空都做;想只做多就设回 "1"
        run: python generate_signals.py

      - name: Build PWA signal feed
        continue-on-error: true
        run: python pwa/build_feed.py

      - name: Alpaca paper trade (real execution, cloud, only if key is set)
        if: ${{ env.ALPACA_API_KEY_ID != '' }}
        continue-on-error: true
        env:
          BROKER: alpaca
          ALPACA_PAPER: "true"     # fake money until you flip this to false + confirm
          BOOK_EQUITY: "200"
          RISK_PCT: "0.05"
          # No margin. This book now holds overnight (see PDT below), and a gap
          # down hits a leveraged position twice as hard — 2x is for same-day
          # risk you can stop out of, which is exactly what PDT takes away.
          LEVERAGE_CAP: "1.0"
          BASE_SLICES: "2"         # concentrate: 1 name takes $200, 2 split $100 each
          MAX_POSITIONS: "2"       # dollar targets need size to stay reachable
          ENABLE_SHORT: "no"       # long-only while holding overnight (shorts gap against you without limit)
          # --- Net-dollar target (same method as the crypto book) ----------
          # Sell once the position is up enough that, after costs, $0.50-$1.00
          # lands in the account. US stocks are commission-free, so FEE_RATE
          # only covers SEC/TAF plus a spread buffer — which is why the moves
          # needed here (0.35%-0.60% on $200) are far smaller than crypto's.
          NET_PROFIT_MODE: "yes"
          FEE_RATE: "0.0005"       # ~0.05%/side: SEC+TAF are tiny; rest is spread buffer
          NET_TARGET_MIN_USD: "0.50"
          NET_TARGET_MAX_USD: "1.00"
          MIN_RR_NET: "1.0"        # stop distance <= target distance
          MAX_TARGET_MOVE_PCT: "0.035"
          # --- PDT guard ---------------------------------------------------
          # Under $25k equity, FINRA allows only 3 same-day round trips per 5
          # business days. Profit exits therefore always wait for the next
          # session — held overnight, the rule does not apply at all and the
          # number of trades is unlimited. A hard stop may still spend one of
          # the 3 slots, because eating a blown stop costs more than the slot.
          NO_DAY_TRADE: "yes"
          DAY_TRADE_LIMIT: "3"
        run: python live_trader.py

      - name: Commit state + reports
        if: always()   # 即使前面某步失败,也要把已生成的信号/状态提交上去
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "bot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
