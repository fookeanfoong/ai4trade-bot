name: forex-signals

# 外汇信号引擎(EUR/USD H1)。**只生成信号,不下单** —— 执行是手动的,在 MT5 上点。
#
# 排程:每小时,H1 K 线收盘后 5 分钟跑一次。
# 外汇周末休市,脚本自己会判断(fx_market_open / OANDA tradeable),所以这里
# 不做星期过滤,让它自己输出 wait 就好。
on:
  schedule:
    - cron: "5 * * * *"       # 每小时:H1 收盘后 5 分钟出信号
    - cron: "0 6 * * 1-5"     # 工作日:开盘前新闻简报 + 事件检测
    - cron: "40 6 * * 1"      # 每周一:稳定性筛选 + 样本外验证回测
  push:
    branches: ["main"]
    paths:
      - ".trigger-forex"
  workflow_dispatch:

concurrency:
  group: forex-signals          # 独立分组,不阻塞股票/加密两本账
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signals:
    runs-on: ubuntu-latest
    env:
      OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # broker_oanda.py 只用标准库(urllib),没有依赖要装。

      # 每天开盘前:外汇新闻简报 + 高影响事件检测。
      # 机器只取「今天该不该停手」,方向判断留给人。
      - name: 外汇新闻简报 + 事件检测
        continue-on-error: true
        run: python news_forex.py

      # 每周一:品种稳定性筛选 + 样本外验证。
      # 这套外汇规则此前从未被回测过 —— 在没验证的规则上加杠杆
      # 等于把未知数乘以 10,所以先补验证。
      - name: 外汇研究 — 稳定性筛选 + 样本外验证
        if: github.event.schedule == '40 6 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FOREX_EQUITY_USD: "200"
          FOREX_MAX_LEVERAGE: "10"
        run: python backtest_forex.py

      - name: Generate forex signals
        continue-on-error: true
        env:
          # yahoo = 免费行情,不需要任何券商账户。
          # 马来西亚开的 OANDA 会被分到 Global Markets(BVI),官方文档明写
          # v20 REST API 对该分支**不开放** —— 所以行情必须和券商解耦。
          FOREX_DATA_SOURCE: "yahoo"
          OANDA_ENV: "practice"
          # 三个美元计价的主要货币对。加品种是**加快样本积累**的正确方法 ——
          # 比放宽规则强得多:规则不变,只是同样的规则用在更多市场上。
          # 三者相关性不完全,成绩相对独立,证据比单一品种可信。
          # 都是 XXX_USD:0.01 手 = $0.10/点,和 EUR/USD 同一套仓位数学。
          # ⚠️ 不加黄金:XAUUSD 合约 100oz,0.01 手 = 1oz = 金价每动 $1 亏 $1,
          #    2% 上限倒推最大止损只有 $4(金价的 0.09%),塞在一根 H1 K 线噪音里。
          #    黄金要能做,本金得 $600(2%)~$1200(1%)。
          # ⬇ 只留 EUR_USD:样本外验证里 GBP/AUD/NZD 一组都没通过,
          #   而 EUR/USD 同时是波动最低(ATR/价格 0.079%)、点差成本最低
          #   (占20点止损的 5%)的品种。见 reports/forex_research.md。
          FOREX_PAIRS: "EUR_USD"
          # H1,不是 H4。这是被仓位数学逼出来的,不是偏好:
          #   MT5 最小 0.01 手 = $0.10/点。$200 本金的 2% 硬上限 = $4 = 40 点。
          #   H4 的止损通常 40~50 点 -> 0.01 手就要 2.3% 风险 -> 每笔都被拦死。
          #   H1 的止损 20 点 -> 0.01 手 = $2.00 = 正好 1.0% -> 成立。
          FOREX_GRANULARITY: "H1"
          # H1 的 60 根只有 2.5 天,找不出结构;开到 120 根 = 5 天。
          FOREX_SWING_LOOKBACK: "120"
          # 有券商连接时会用账户真实净值覆盖这个数;这里只是兜底。
          FOREX_EQUITY_USD: "200"
          # 1% = $2/笔。连亏 10 笔还剩 $180,仍在牌桌上。
          # 脚本内有 2% 硬上限,调高也会被夹回来。
          FOREX_RISK_PCT: "1.0"
          # 25点 + 1:1.5 = 唯一通过样本外验证的配置。
          # 我原本的 20点 + 1:2 没通过 —— 参数按数据改,不按我的直觉。
          FOREX_MIN_STOP_PIPS: "25"
          FOREX_RR1: "1.5"
          # 杠杆上限 10x。注意:风险%定量下杠杆是**结果**不是输入 ——
          # 20点止损+1%风险在 $200 上算出来本来就是约 5.8x,这个上限只是封顶。
          # 它不会让你"用上"10倍,只是不让极窄止损把仓位吹大。
          FOREX_MAX_LEVERAGE: "10"
          # 高影响事件(CPI/零售)前 12 小时不开新仓,见 forex_events.json
          FOREX_BLACKOUT_HOURS: "12"
        run: python generate_signals_forex.py

      # 自动执行层。**当前路线(手动执行)下它是空转的** —— 没有 OANDA_TOKEN
      # 它会直接报「未配置」然后退出,不做任何事。留着是因为如果哪天换到有
      # REST API 的券商,把 FOREX_EXECUTE 改成 "yes" 就能接上,不用重写。
      - name: Execute triggered plans (TP1 全平) — 手动路线下不动作
        continue-on-error: true
        env:
          OANDA_ENV: "practice"
          FOREX_EXECUTE: "no"
          FOREX_MAX_OPEN: "2"           # 最多同时 2 个仓位
          FOREX_MAX_PENDING: "2"        # 最多同时 2 张挂单
          FOREX_ORDER_EXPIRY_HOURS: "24"  # 挂单 24h 不成交自动撤销
        run: python live_trader_forex.py

      # 每小时重写当天的战报,所以这个文件全天都是最新的。
      # 报的是「信号战绩(R)」和「如果照做的假设美元」,两者分开列 ——
      # 机器人不下单,没有真实收益可报。
      - name: Daily report
        continue-on-error: true
        env:
          FOREX_EQUITY_USD: "200"
        run: python forex_daily_report.py

      - name: Commit forex signals
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "forex signals $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
