name: crypto-scalp-lab

# 网上流传的快进快出策略,逐个用币安真实 M5 数据做样本内选参 + 样本外验证。
# Claude 的沙箱拿不到行情,真实数字只能在这里产生。
on:
  schedule:
    - cron: "50 6 * * 1"        # 每周一重跑
  workflow_dispatch:
  push:
    paths:
      - crypto_scalp_lab.py
      - backtest_crypto_scalper.py
      - .github/workflows/crypto_scalp_lab.yml

concurrency:
  group: crypto-scalp-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strategy lab — M5, 12 months, IS/OOS
        continue-on-error: true
        run: python crypto_scalp_lab.py --interval 5m --months 12 --spread-pct 0.04 --out reports/crypto_scalp_lab.md
      - name: Strategy lab — M15, 24 months, IS/OOS
        continue-on-error: true
        run: python crypto_scalp_lab.py --interval 15m --months 24 --spread-pct 0.04 --out reports/crypto_scalp_lab_15m.md
      - name: Strategy lab — H1, 24 months, IS/OOS
        continue-on-error: true
        run: python crypto_scalp_lab.py --interval 1h --months 24 --spread-pct 0.04 --out reports/crypto_scalp_lab_1h.md
      - name: Strategy lab — M1 quick in/out, ETH first, 12 months, IS/OOS
        continue-on-error: true
        run: >
          python crypto_scalp_lab.py --interval 1m --months 12 --spread-pct 0.04
          --symbols ETHUSDT,BTCUSDT,SOLUSDT
          --only m1_ribbon,m1_bb_rsi4,m1_vwap_fade,m1_spike_fade,rsi2,bb_rsi,ema3_srsi
          --out reports/crypto_scalp_lab_1m.md
      - name: Strategy lab — H1 3EMA+StochRSI faster exits, 24 months
        continue-on-error: true
        run: >
          python crypto_scalp_lab.py --interval 1h --months 24 --spread-pct 0.04
          --symbols SOLUSDT,BTCUSDT,ETHUSDT --only ema3_srsi,ema3_srsi_fast
          --out reports/crypto_scalp_lab_1h_fast.md
      - name: Commit report
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/crypto_scalp_lab*.md || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "crypto scalp lab $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
