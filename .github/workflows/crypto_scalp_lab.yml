name: crypto-scalp-lab

# 网上流传的快进快出策略,逐个用币安真实 M5 数据做样本内选参 + 样本外验证。
# Claude 的沙箱拿不到行情,真实数字只能在这里产生。
on:
  schedule:
    - cron: "50 6 * * 1"        # 每周一重跑
  workflow_dispatch:
  push:
    paths:
      - crypto_scalp_lab.py
      - backtest_crypto_scalper.py
      - .github/workflows/crypto_scalp_lab.yml

concurrency:
  group: crypto-scalp-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strategy lab — BTC/ETH/SOL M5, 12 months, IS/OOS
        run: python crypto_scalp_lab.py --symbols BTCUSDT,ETHUSDT,SOLUSDT --months 12 --spread-pct 0.04
      - name: Commit report
        if: always()
        run: |
          git config user.name  "ai4trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/crypto_scalp_lab.md || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git commit -m "crypto scalp lab $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
